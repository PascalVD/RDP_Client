<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="Arial, sans-serif">
  <!-- CITY HEIST - Plan de placement (vue de dessus, Nord = haut) -->
  <rect x="0" y="0" width="900" height="760" fill="#0a0e13"/>
  <text x="450" y="34" fill="#e8e8e8" font-size="22" font-weight="bold" text-anchor="middle">CITY HEIST – POLICE VS VOLEURS — Plan de la ville (nuit)</text>
  <text x="450" y="56" fill="#8aa" font-size="13" text-anchor="middle">Nord = haut (+Y). Origine (0,0) = Banque. Échelle : 1 case ≈ 20 m.</text>

  <!-- Routes -->
  <rect x="60" y="360" width="780" height="44" fill="#15151a"/>
  <text x="80" y="386" fill="#556" font-size="12">Route principale (E-O)</text>
  <rect x="430" y="120" width="40" height="540" fill="#15151a"/>
  <text x="436" y="140" fill="#556" font-size="11" transform="rotate(90 446 140)">Route N-S</text>

  <!-- Bâtiments -->
  <!-- Commissariat -->
  <g>
    <rect x="80" y="340" width="120" height="84" fill="#1a3b8c" stroke="#3b6bd6" stroke-width="2"/>
    <text x="140" y="378" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">COMMISSARIAT</text>
    <text x="140" y="396" fill="#cdd" font-size="10" text-anchor="middle">(-120, 0) base police</text>
  </g>
  <!-- Prison -->
  <g>
    <rect x="90" y="470" width="100" height="70" fill="#1a3b8c" stroke="#3b6bd6" stroke-width="2"/>
    <text x="140" y="500" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">PRISON</text>
    <text x="140" y="518" fill="#cdd" font-size="10" text-anchor="middle">(-120,-40) · 30s</text>
  </g>
  <!-- Banque -->
  <g>
    <rect x="386" y="328" width="128" height="108" fill="#5a5a63" stroke="#c9a14a" stroke-width="3"/>
    <text x="450" y="372" fill="#fff" font-size="15" text-anchor="middle" font-weight="bold">BANQUE</text>
    <text x="450" y="392" fill="#eee" font-size="10" text-anchor="middle">(0,0) · +5 · 45s</text>
  </g>
  <!-- Parking souterrain -->
  <g>
    <rect x="392" y="446" width="116" height="40" fill="#26262b" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="450" y="470" fill="#bbb" font-size="10" text-anchor="middle">PARKING S-SOL (z=-15)</text>
  </g>
  <!-- Bijouterie -->
  <g>
    <rect x="530" y="170" width="92" height="66" fill="#7a1850" stroke="#e23ea0" stroke-width="2"/>
    <text x="576" y="200" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">BIJOUTERIE</text>
    <text x="576" y="218" fill="#fdd" font-size="10" text-anchor="middle">(40,60) · +2 · 12s</text>
  </g>
  <!-- Supérette -->
  <g>
    <rect x="600" y="330" width="86" height="52" fill="#7a1850" stroke="#e23ea0" stroke-width="2"/>
    <text x="643" y="352" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">SUPÉRETTE</text>
    <text x="643" y="368" fill="#fdd" font-size="9" text-anchor="middle">(60,10)</text>
  </g>
  <!-- Station essence -->
  <g>
    <rect x="600" y="396" width="92" height="40" fill="#2b2b30" stroke="#888" stroke-width="2"/>
    <text x="646" y="420" fill="#ddd" font-size="10" text-anchor="middle">STATION ESSENCE (64,-8)</text>
  </g>
  <!-- Casino -->
  <g>
    <rect x="560" y="560" width="120" height="92" fill="#5a1466" stroke="#c14ee2" stroke-width="2"/>
    <text x="620" y="600" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">CASINO</text>
    <text x="620" y="620" fill="#fcf" font-size="10" text-anchor="middle">(80,-120) · +3 · 25s</text>
  </g>
  <!-- Planque -->
  <g>
    <rect x="740" y="470" width="120" height="84" fill="#8c4a14" stroke="#e6932a" stroke-width="3"/>
    <text x="800" y="504" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">PLANQUE</text>
    <text x="800" y="522" fill="#fed" font-size="10" text-anchor="middle">(140,-80) base voleurs</text>
    <text x="800" y="538" fill="#fed" font-size="9" text-anchor="middle">dépôt butin + spawn</text>
  </g>
  <!-- Quartier résidentiel -->
  <g>
    <rect x="740" y="150" width="120" height="120" fill="#3a342c" stroke="#7a6f5a" stroke-width="2"/>
    <text x="800" y="200" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">QUARTIER</text>
    <text x="800" y="216" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">RÉSIDENTIEL</text>
    <text x="800" y="236" fill="#ddc" font-size="10" text-anchor="middle">(150-168, 80-98)</text>
  </g>

  <!-- Égouts (lignes pointillées) -->
  <g stroke="#2f7d5b" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M450 446 L450 486 L740 486"/>
    <path d="M450 470 L620 560"/>
    <path d="M508 466 L740 200"/>
  </g>
  <text x="470" y="700" fill="#2f7d5b" font-size="11">— — Égouts / raccourcis voleurs</text>

  <!-- Barrages police -->
  <g fill="#e6c200">
    <rect x="300" y="352" width="10" height="24"/>
    <rect x="450" y="430" width="24" height="10"/>
    <rect x="556" y="540" width="24" height="10"/>
  </g>
  <text x="60" y="700" fill="#e6c200" font-size="11">▮ Barrages / points de contrôle police</text>

  <!-- Légende couleurs -->
  <g font-size="11">
    <rect x="60" y="720" width="14" height="14" fill="#1a3b8c"/><text x="80" y="732" fill="#cdd">Police (bleu)</text>
    <rect x="190" y="720" width="14" height="14" fill="#8c4a14"/><text x="210" y="732" fill="#cdd">Voleurs (orange)</text>
    <rect x="330" y="720" width="14" height="14" fill="#7a1850"/><text x="350" y="732" fill="#cdd">Néon (objectifs)</text>
    <rect x="470" y="720" width="14" height="14" fill="#5a5a63"/><text x="490" y="732" fill="#cdd">Banque (civic)</text>
  </g>
</svg>
